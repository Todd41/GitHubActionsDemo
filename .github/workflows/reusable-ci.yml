name: Reusable CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to run against
        type: string
        required: true
    secrets:
      greeting-secret:
        description: Optional phrase passed to the app as a demo of secret propagation
        required: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-app
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm run lint
      - run: npm test
      - name: Run the app
        env:
          GREETING_SECRET: ${{ secrets.greeting-secret }}
        run: node src/index.js "Node ${{ inputs.node-version }}"
      - name: Create build artifact
        run: |
          mkdir -p dist
          cat > dist/release.json <<JSON
          {
            "commit": "${{ github.sha }}",
            "nodeVersion": "${{ inputs.node-version }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ inputs.node-version }}
          path: dist/
